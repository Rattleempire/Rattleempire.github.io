<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Apply to become a seller on Rattle Empire">
  <title>Become a Seller • Rattle Empire</title>
  <link rel="stylesheet" href="../assets/styles.css">
</head>
<body>

  <div id="menu-placeholder"></div>

  <main>
    <section class="container section" style="padding-top:60px;max-width:700px">
      <div class="eyebrow">SELLER ONBOARDING</div>
      <h1>Run your inventory</h1>
      <p style="color:#8d97a8;margin-bottom:32px">
        Create listings, manage stock, monitor orders and submit products for marketplace approval.
      </p>

      <form id="sellerApplication" style="display:flex;flex-direction:column;gap:20px">
        <div>
          <label style="font-weight:600;display:block;margin-bottom:4px">Business / Display name</label>
          <input type="text" placeholder="e.g. GameKeys Shop" required style="width:100%;padding:12px;border-radius:8px;border:1px solid #2e3440;background:transparent">
        </div>

        <div>
          <label style="font-weight:600;display:block;margin-bottom:4px">Email address</label>
          <input type="email" placeholder="you@example.com" required style="width:100%;padding:12px;border-radius:8px;border:1px solid #2e3440;background:transparent">
        </div>

        <div>
          <label style="font-weight:600;display:block;margin-bottom:4px">Product type</label>
          <select required style="width:100%;padding:12px;border-radius:8px;border:1px solid #2e3440;background:transparent">
            <option value="">Select category...</option>
            <option value="AI">AI & Productivity</option>
            <option value="Streaming">Streaming</option>
            <option value="Software">Software</option>
            <option value="Gaming">Gaming</option>
          </select>
        </div>

        <div>
          <label style="font-weight:600;display:block;margin-bottom:4px">Brief description of your inventory</label>
          <textarea rows="4" placeholder="What digital products will you offer?" style="width:100%;padding:12px;border-radius:8px;border:1px solid #2e3440;background:transparent"></textarea>
        </div>

        <button type="submit" class="primary-btn large" style="width:fit-content">Submit application →</button>
      </form>

      <div id="formMessage" style="margin-top:16px"></div>
    </section>
  </main>
  
  <div id="footer-placeholder"></div>

  <script src="../assets/app.js" defer></script>

  <script>
    fetch('../partials/menu.html')
      .then(res => res.text())
      .then(data => document.getElementById('menu-placeholder').innerHTML = data)
      .catch(() => {});

    fetch('../partials/footer.html')
      .then(res => res.text())
      .then(data => document.getElementById('footer-placeholder').innerHTML = data)
      .catch(() => {});

    document.getElementById('sellerApplication').addEventListener('submit', function(e) {
      e.preventDefault(); 
      document.getElementById('formMessage').innerHTML = 
        '<div class="info-card" style="background:#00ff9d10;border-color:#00ff9d40">' +
        '<p style="color:#00ff9d">✅ Application received! Our admin team will review your request.</p>' +
        '</div>';
      this.reset(); 
    });
  </script>

</body>
</html>
