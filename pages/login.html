<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Sign in to Rattle Empire">
  <meta property="og:title" content="Rattle Empire — Verified Digital Marketplace">
  <meta property="og:description" content="Authorized subscriptions, licenses and gift codes. Instant delivery, verified sellers.">
  <meta property="og:image" content="https://rattleempire.github.io/logo.jpg">
  <meta property="og:url" content="https://rattleempire.github.io/">
  <meta name="theme-color" content="#0e1116">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
        img-src 'self' data:;
        style-src 'self' 'unsafe-inline';
        script-src 'self';
        font-src 'self';
        connect-src 'self';">
  <title>Sign in • Rattle Empire</title>
  <link rel="icon" type="image/jpeg" href="/logo.jpg">
  <link rel="stylesheet" href="../assets/styles.css?v=3.4">
</head>
<body>

  <div id="menu-placeholder"></div>

  <main class="container" style="padding-top:60px;padding-bottom:90px">
    <div class="eyebrow">ACCOUNT</div>
    <h1>Sign in</h1>

    <div class="info-card" style="max-width:460px;margin-top:24px;padding:26px">
      <form data-demo
            data-demo-title="Sign in"
            data-demo-message="Authentication will connect to the secure backend in the production phase.">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" required>
        <div style="height:14px"></div>
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" required>
        <div style="height:18px"></div>
        <button class="primary-btn" type="submit" style="width:100%">Sign in →</button>
      </form>
      <p style="color:var(--text-muted);font-size:12px;margin:16px 0 0">
        New to Rattle Empire? Accounts open with the production backend.
        <a href="/pages/sell.html" style="color:var(--accent)">Become a seller →</a>
      </p>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="../assets/app.js?v=3.4" defer></script>
  <script src="../assets/page-forms.js?v=3.0" defer></script>
</body>
</html>
