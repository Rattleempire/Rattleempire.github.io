<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Your shopping cart on Rattle Empire">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
        img-src 'self' data:;
        style-src 'self' 'unsafe-inline';
        script-src 'self';
        font-src 'self';
        connect-src 'self';">
  <title>Cart • Rattle Empire</title>
  <link rel="icon" type="image/jpeg" href="/logo.jpg">
  <link rel="stylesheet" href="../assets/styles.css?v=3.0">
</head>
<body>

  <div id="menu-placeholder"></div>

  <main class="container" style="padding-top:60px;padding-bottom:90px">
    <div class="eyebrow">CART</div>
    <h1>Your cart</h1>

    <div class="info-card" style="margin-top:24px">
      <div id="cartItems"></div>
      <div style="margin-top:16px;display:flex;gap:12px;flex-wrap:wrap">
        <a class="primary-btn" href="/">Continue shopping →</a>
        <button class="ghost-btn" id="clearCartBtn" style="border-color:#c0504e;color:#c0504e">Clear cart</button>
      </div>
    </div>

    <div class="info-card" style="margin-top:20px">
      <h3 style="margin:0">💳 Checkout</h3>
      <p style="color:var(--text-secondary);font-size:13px;margin:8px 0 0">
        Secure backend checkout will be connected in the production phase.
      </p>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="../assets/app.js?v=3.0" defer></script>
  <script src="../assets/cart.js?v=3.0" defer></script>
</body>
</html>
