<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Browse all products on Rattle Empire">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
        img-src 'self' data:;
        style-src 'self' 'unsafe-inline';
        script-src 'self';
        font-src 'self';
        connect-src 'self';">
  <title>All products • Rattle Empire</title>
  <link rel="icon" type="image/jpeg" href="/logo.jpg">
  <link rel="stylesheet" href="../assets/styles.css?v=3.1">
</head>
<body>

  <div id="menu-placeholder"></div>

  <main class="container" style="padding-top:60px;padding-bottom:90px">
    <section class="section" id="marketplace" style="padding-top:0">
      <div class="section-head">
        <div><div class="eyebrow">MARKETPLACE</div><h2>All products</h2></div>
        <div class="market-tools">
          <input class="search" id="searchInput" placeholder="Search products..." autocomplete="off">
          <select id="sortSelect">
            <option value="featured">Featured</option>
            <option value="price-asc">Lowest price</option>
            <option value="price-desc">Highest price</option>
            <option value="rating">Top rated</option>
          </select>
        </div>
      </div>
      <div class="filter-row" id="filterRow">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="ai">AI</button>
        <button class="filter" data-filter="streaming">Streaming</button>
        <button class="filter" data-filter="software">Software</button>
        <button class="filter" data-filter="gaming">Gaming</button>
      </div>
      <div id="productGrid" class="product-grid"></div>
      <div id="emptyState" class="empty-state" hidden>No products match your search.</div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="../assets/app.js?v=3.1" defer></script>
</body>
</html>
