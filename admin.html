<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://rattleempire.github.io; img-src *;">
<title>Rattle Empire — Admin (Private)</title>
<style>
 body{background:#020817;color:#fff;font-family:Inter,system-ui,sans-serif;margin:0;padding:16px}
 .wrap{max-width:720px;margin:0 auto}
 h1{font-size:20px;background:linear-gradient(135deg,#0284c7,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
 .card{background:rgba(15,23,42,.6);backdrop-filter:blur(16px);border:1px solid rgba(165,243,252,.15);border-radius:14px;padding:16px;margin-bottom:14px}
 label{font-size:11px;color:#888;display:block;margin:8px 0 4px}
 input,select,textarea{width:100%;box-sizing:border-box;background:rgba(255,255,255,.06);border:1px solid rgba(165,243,252,.15);color:#fff;border-radius:10px;padding:10px;font-size:14px;outline:none}
 .btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#0284c7,#22d3ee);border:none;color:#000;font-weight:700;padding:12px 18px;border-radius:10px;cursor:pointer;font-size:13px;margin-top:10px}
 .btn.red{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff}
 .btn.ghost{background:rgba(255,255,255,.08);color:#fff}
 .row{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);padding:10px 0}
 .pname{font-size:13px;font-weight:600}.pmeta{font-size:11px;color:#888}
 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
 .stat{display:flex;gap:10px}.stat div{flex:1;background:rgba(255,255,255,.04);border-radius:10px;padding:10px;text-align:center}
 .stat b{font-size:18px;color:#22d3ee;display:block}
 .hidden{display:none}
 .tagc{font-size:9px;background:rgba(74,222,128,.15);color:#4ade80;padding:2px 8px;border-radius:99px}
 .tagd{font-size:9px;background:rgba(255,255,255,.08);color:#888;padding:2px 8px;border-radius:99px}
 .warn{font-size:10px;color:#fbbf24;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
<h1>🛠️ Rattle Empire Admin <span style="font-size:10px;color:#f87171">PRIVATE — DO NOT UPLOAD</span></h1>

<div class="card" id="gate">
  <label>Admin passcode</label>
  <input type="password" id="pass" placeholder="Enter passcode" autocomplete="off">
  <button class="btn" onclick="unlock()">🔓 Unlock Dashboard</button>
  <p class="warn" id="lock-msg"></p>
</div>

<div id="dash" class="hidden">
  <div class="card stat">
    <div><b id="st-total">0</b>Live products</div>
    <div><b id="st-added">0</b>Added by you</div>
    <div><b id="st-removed">0</b>Removed</div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 6px;font-size:15px">➕ Add Product</h3>
    <label>Name</label><input id="f-name" placeholder="e.g. ChatGPT Plus (6 Months)">
    <div class="grid2">
      <div><label>Price (UGX)</label><input id="f-price" type="number" placeholder="45000"></div>
      <div><label>Old price (optional)</label><input id="f-old" type="number" placeholder="80000"></div>
    </div>
    <div class="grid2">
      <div><label>Category</label><select id="f-cat">
        <option value="chatgpt">ChatGPT</option><option value="claude">Claude</option><option value="gemini">Gemini</option>
        <option value="netflix">Netflix</option><option value="spotify">Spotify</option><option value="youtube">YouTube</option>
        <option value="midjourney">Midjourney</option><option value="ai-tools">AI Tools</option><option value="creative">Creative</option>
        <option value="developer">Developer</option><option value="productivity">Productivity</option>
      </select></div>
      <div><label>Seller</label><input id="f-seller" placeholder="Trevor Labs"></div>
    </div>
    <label>Image URL (optional — auto if empty)</label><input id="f-img" placeholder="https://...">
    <label>Description</label><textarea id="f-desc" rows="2" placeholder="Short selling line..."></textarea>
    <button class="btn" onclick="addProduct()">🚀 Publish Product</button>
  </div>

  <div class="card">
    <h3 style="margin:0 0 6px;font-size:15px">📦 Catalog</h3>
    <input id="q" oninput="renderList()" placeholder="Search products...">
    <div id="list"></div>
    <div id="removed-zone"></div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 6px;font-size:15px">🌍 Publish & Settings</h3>
    <button class="btn ghost" onclick="exportCatalog()">📤 Export catalog.json</button>
    <button class="btn ghost" onclick="location.href='https://rattleempire.github.io/'">🏬 Open Store</button>
    <button class="btn red" onclick="lockNow()">🔒 Lock Session</button>
    <label>Change passcode (stored as hash only)</label>
    <div class="grid2"><input id="new-pass" type="password" placeholder="New passcode (min 8 chars)"><button class="btn ghost" onclick="changePass()">Save</button></div>
  </div>
</div>
</div>

<script src="https://rattleempire.github.io/scripts.js"></script>
<script>
/* =========================================================
   🔐 SECURITY MODEL (read this)
   - NO plaintext passcode anywhere. Only a salted SHA-256 hash.
   - Sessions expire after 30 min (sessionStorage dies on tab close).
   - Escalating lockout: 5 fails = 10 min, 10 fails = 60 min.
   - NOTE: This file must NEVER be uploaded. Client-side gates can
     always be bypassed via DevTools on a public host — keeping this
     file OFF the public site IS the security.
   ========================================================= */
const SALT = 'RE_SALT_2026';
const ADMIN_HASH = 'PASTE_YOUR_SHA256_HASH_HERE'; // see generator below
const LOCK_KEY = 're_admin_lock';
const SESSION_KEY = 're_admin_session';
const SESSION_MIN = 30;

async function sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
/* ONE-TIME setup: open DevTools console on this page and run:
   sha256('RE_SALT_2026::YourNewPasscode').then(h => console.log('PASTE THIS AS ADMIN_HASH →', h));
*/

function getLock(){ return JSON.parse(localStorage.getItem(LOCK_KEY) || '{"fails":0,"until":0}'); }
function sessionValid(){
    try { const s = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null');
          return s && (Date.now() - s.t < SESSION_MIN * 60000); } catch(e){ return false; }
}
async function verify(pass){
    const h = await sha256(SALT + '::' + pass);
    const override = localStorage.getItem('re_admin_hash'); // hashed change-passcode
    return h === (override || ADMIN_HASH);
}

async function unlock(){
    const lock = getLock();
    const msg = document.getElementById('lock-msg');
    if (Date.now() < lock.until) {
        msg.textContent = '🔒 Locked. Try again in ' + Math.ceil((lock.until - Date.now()) / 60000) + ' min.';
        return;
    }
    const pass = document.getElementById('pass').value;
    if (await verify(pass)) {
        localStorage.setItem(LOCK_KEY, '{"fails":0,"until":0}');
        sessionStorage.setItem(SESSION_KEY, JSON.stringify({ t: Date.now() }));
        showDash();
    } else {
        lock.fails++;
        if (lock.fails >= 10)     { lock.until = Date.now() + 3600000; lock.fails = 0; }
        else if (lock.fails >= 5) { lock.until = Date.now() + 600000;  lock.fails = 0; }
        localStorage.setItem(LOCK_KEY, JSON.stringify(lock));
        msg.textContent = '❌ Wrong passcode. ' + (lock.until ? 'Locked ' + Math.ceil((lock.until - Date.now())/60000) + ' min.' : '(' + (5 - lock.fails) + ' attempts left)');
    }
}
function lockNow(){ sessionStorage.removeItem(SESSION_KEY); location.reload(); }

function showDash(){
    if (!sessionValid()) return;
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('dash').classList.remove('hidden');
    refresh();
    setInterval(() => { if (!sessionValid()) lockNow(); }, 30000); // auto-expire
}
function refresh(){
    document.getElementById('st-total').textContent = products.length;
    document.getElementById('st-added').textContent = getCustom().length;
    document.getElementById('st-removed').textContent = getRemoved().length;
    renderList();
}
const getRemoved = () => JSON.parse(localStorage.getItem('re_removed') || '[]');
const getCustom  = () => JSON.parse(localStorage.getItem('re_custom') || '[]');

function renderList(){
    const q = (document.getElementById('q').value || '').toLowerCase();
    const customIds = getCustom().map(p => p.id);
    document.getElementById('list').innerHTML = products.filter(p => p.name.toLowerCase().includes(q)).map(p => `
      <div class="row">
        <div><div class="pname">${p.name} ${customIds.includes(p.id) ? '<span class="tagc">YOURS</span>' : '<span class="tagd">DEFAULT</span>'}</div>
        <div class="pmeta">UGX ${p.price.toLocaleString()} • ${p.category}</div></div>
        <button class="btn red" style="margin:0;padding:8px 12px" onclick="removeProduct(${p.id})">🗑</button>
      </div>`).join('') || '<p style="color:#666;font-size:12px">No matches.</p>';
    const removed = getRemoved();
    document.getElementById('removed-zone').innerHTML = removed.length ?
      '<h4 style="font-size:12px;color:#888;margin:12px 0 4px">Removed (tap to restore)</h4>' +
      removed.map(id => `<button class="btn ghost" style="margin:4px" onclick="restore(${id})">#${id}</button>`).join('') : '';
}
const CAT_IMG = {
  chatgpt:"https://images.unsplash.com/photo-1677442136019-21780ecad995?w=400&h=300&fit=crop",
  claude:"https://images.unsplash.com/photo-1620712943543-bcc4688e7485?w=400&h=300&fit=crop",
  gemini:"https://images.unsplash.com/photo-1677442136019-21780ecad995?w=400&h=300&fit=crop",
  netflix:"https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=400&h=300&fit=crop",
  spotify:"https://images.unsplash.com/photo-1611339555312-e607c835872e?w=400&h=300&fit=crop",
  youtube:"https://images.unsplash.com/photo-1611162616475-46b635cb6868?w=400&h=300&fit=crop",
  midjourney:"https://images.unsplash.com/photo-1633419461250-d1d1a3d1d1d1?w=400&h=300&fit=crop",
  "ai-tools":"https://images.unsplash.com/photo-1620712943543-bcc4688e7485?w=400&h=300&fit=crop",
  creative:"https://images.unsplash.com/photo-1626785774573-4b799315345d?w=400&h=300&fit=crop",
  developer:"https://images.unsplash.com/photo-1618401471353-b98afee0b2eb?w=400&h=300&fit=crop",
  productivity:"https://images.unsplash.com/photo-1455390582262-044cdead3037?w=400&h=300&fit=crop"
};
function addProduct(){
    const name = document.getElementById('f-name').value.trim();
    const price = +document.getElementById('f-price').value;
    if (!name || !price) { showToast('⚠️ Name & price required'); return; }
    const cat = document.getElementById('f-cat').value;
    const p = {
        id: 1000 + (Date.now() % 1000000), name, price,
        originalPrice: +document.getElementById('f-old').value || 0,
        category: cat, seller: document.getElementById('f-seller').value.trim() || 'Rattle Empire',
        sellerLoc: 'Kampala', rating: 5.0, reviews: 0, sold: 0, featured: true,
        warranty: 'lifetime', delivery: 'instant',
        image: document.getElementById('f-img').value.trim() || CAT_IMG[cat],
        description: document.getElementById('f-desc').value.trim() || name + ' — instant delivery, lifetime warranty.'
    };
    const custom = getCustom(); custom.unshift(p);
    localStorage.setItem('re_custom', JSON.stringify(custom));
    products.push(p);
    ['f-name','f-price','f-old','f-img','f-desc'].forEach(i => document.getElementById(i).value = '');
    refresh(); showToast('✅ ' + p.name + ' published!');
}
function removeProduct(id){
    const custom = getCustom(); const ci = custom.findIndex(p => p.id === id);
    if (ci > -1) { custom.splice(ci,1); localStorage.setItem('re_custom', JSON.stringify(custom)); }
    else { const r = getRemoved(); if (!r.includes(id)) { r.push(id); localStorage.setItem('re_removed', JSON.stringify(r)); } }
    const pi = products.findIndex(p => p.id === id); if (pi > -1) products.splice(pi,1);
    refresh(); showToast('🗑 Product removed');
}
function restore(id){
    localStorage.setItem('re_removed', JSON.stringify(getRemoved().filter(x => x !== id)));
    location.reload();
}
function exportCatalog(){
    const data = JSON.stringify({ add: getCustom(), remove: getRemoved() }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'catalog.json'; a.click();
    showToast('📥 catalog.json downloaded — upload it to your GitHub repo');
}
async function changePass(){
    const v = document.getElementById('new-pass').value.trim();
    if (v.length < 8) { showToast('⚠️ Min 8 characters'); return; }
    localStorage.setItem('re_admin_hash', await sha256(SALT + '::' + v));
    document.getElementById('new-pass').value = '';
    showToast('✅ Passcode changed (stored as hash)');
}
showDash();
</script>
</body>
</html>
